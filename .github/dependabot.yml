version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Asia/Colombo
    open-pull-requests-limit: 5
    groups:
      safe-development-updates:
        dependency-type: development
        update-types:
          - minor
          - patch
    commit-message:
      prefix: dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:15"
      timezone: Asia/Colombo
    open-pull-requests-limit: 3
    commit-message:
      prefix: actions
