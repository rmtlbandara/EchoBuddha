name: Production Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "31 4 * * 3"

permissions:
  actions: read
  contents: read

concurrency:
  group: production-smoke
  cancel-in-progress: true

jobs:
  production-smoke:
    name: Production smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SMOKE_OUT_DIR: .artifacts/production-smoke
    steps:
      - name: Checkout smoke implementation
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version

      # Records-only commits can move main ahead of production. Compare the live
      # site with the last successful deployment, not the newest commit on main.
      - name: Resolve latest deployed release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="$(gh run list --workflow deploy-production.yml --branch main --status success --limit 1 --json headSha --jq '.[0].headSha')"
          if ! printf '%s' "$sha" | grep -Eq '^[a-f0-9]{40}$'; then
            echo "::error::Could not resolve the latest successful production deployment."
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Check exact production host
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: npm run audit:production-smoke

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: production-smoke-${{ github.run_id }}
          path: .artifacts/production-smoke/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
