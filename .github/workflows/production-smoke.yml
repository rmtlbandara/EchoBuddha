name: Production Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "31 4 * * 3"

permissions:
  contents: read

concurrency:
  group: production-smoke
  cancel-in-progress: true

jobs:
  production-smoke:
    name: Production smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RELEASE_SHA: ${{ github.sha }}
      SMOKE_OUT_DIR: .artifacts/production-smoke
    steps:
      - name: Checkout smoke implementation
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version

      - name: Check exact production host
        run: npm run audit:production-smoke

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-smoke-${{ github.run_id }}
          path: .artifacts/production-smoke/
          if-no-files-found: error
          retention-days: 30
