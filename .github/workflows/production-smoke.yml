name: Production Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "31 4 * * 3"

permissions:
  contents: read

concurrency:
  group: production-smoke
  cancel-in-progress: true

jobs:
  production-smoke:
    name: Production smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RELEASE_SHA: ${{ github.sha }}
      SMOKE_OUT_DIR: .artifacts/production-smoke
    steps:
      - name: Checkout smoke implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version

      - name: Check exact production host
        run: npm run audit:production-smoke

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: production-smoke-${{ github.run_id }}
          path: .artifacts/production-smoke/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
