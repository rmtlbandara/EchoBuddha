name: Search Measurement

on:
  workflow_dispatch:
  schedule:
    # Weekly from the next Thursday (2026-10-29); collection is read-only.
    - cron: '23 5 * * 4'

permissions:
  contents: read

concurrency:
  group: echobuddha-search-measurement
  cancel-in-progress: false

jobs:
  collect:
    name: Collect finalized Search Console evidence
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ECHOBUDDHA_GSC_CLIENT_FILE: .artifacts/private-auth/client.json
      ECHOBUDDHA_GSC_TOKEN_FILE: .artifacts/private-auth/token.json
      ECHOBUDDHA_BING_KEY_FILE: .artifacts/private-auth/bing-key.txt
    steps:
      - name: Checkout trusted measurement tooling
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install deterministic dependencies
        run: npm ci
      - name: Prepare read-only authentication files
        env:
          GSC_CLIENT_JSON: ${{ secrets.ECHOBUDDHA_GSC_CLIENT_JSON }}
          GSC_TOKEN_JSON: ${{ secrets.ECHOBUDDHA_GSC_TOKEN_JSON }}
          BING_API_KEY: ${{ secrets.ECHOBUDDHA_BING_API_KEY }}
        run: |
          mkdir -p .artifacts/private-auth
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          if (!process.env.GSC_CLIENT_JSON || !process.env.GSC_TOKEN_JSON) throw new Error('Read-only GSC secrets are missing');
          fs.writeFileSync(process.env.ECHOBUDDHA_GSC_CLIENT_FILE, process.env.GSC_CLIENT_JSON, { mode: 0o600 });
          fs.writeFileSync(process.env.ECHOBUDDHA_GSC_TOKEN_FILE, process.env.GSC_TOKEN_JSON, { mode: 0o600 });
          if (!process.env.BING_API_KEY) throw new Error('Existing Bing API credential is missing');
          fs.writeFileSync(process.env.ECHOBUDDHA_BING_KEY_FILE, process.env.BING_API_KEY, { mode: 0o600 });
          JS
      - name: Collect read-only Bing sitemap, traffic, and crawl evidence
        run: npm run collect:bing
      - name: Collect available finalized history and inspect canonicals
        run: npm run collect:phase2:gsc
      - name: Generate aggregate measurement reports
        run: npm run generate:phase2:measurement
      - name: Upload aggregate evidence only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: search-measurement-${{ github.run_id }}
          path: |
            .artifacts/bing/summary.json
            docs/audits/phase-2-measurement-2026-09-29/REVISED_OBSERVATION.md
            docs/audits/phase-2-measurement-2026-09-29/PHASE_2_STATUS.json
            docs/audits/phase-2-measurement-2026-09-29/CLUSTER_TOTAL_PERFORMANCE.csv
            docs/audits/phase-2-measurement-2026-09-29/GSC_PERFORMANCE_SUMMARY.md
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
      - name: Remove private inputs from the runner
        if: always()
        run: node --input-type=module -e "import fs from 'node:fs'; for (const directory of ['.artifacts/private-auth', '.artifacts/phase2-gsc', '.artifacts/bing']) fs.rmSync(directory, { recursive:true, force:true });"
