name: Rollback Production

on:
  workflow_dispatch:
    inputs:
      version_id:
        description: Exact previously verified Cloudflare Worker version UUID
        required: true
        type: string
      reason:
        description: Incident or failure reason for the rollback record
        required: true
        type: string
      confirm:
        description: Type ROLLBACK to authorize the production change
        required: true
        type: string

permissions:
  contents: read

jobs:
  rollback-production:
    name: Roll back and verify production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://echobuddha.com
    concurrency:
      group: echobuddha-production
      cancel-in-progress: false
    env:
      ROLLBACK_VERSION_ID: ${{ inputs.version_id }}
      ROLLBACK_REASON: ${{ inputs.reason }}
      ROLLBACK_CONFIRM: ${{ inputs.confirm }}
      RELEASE_SHA: rollback-${{ inputs.version_id }}
      SMOKE_OUT_DIR: .artifacts/production-smoke
    steps:
      - name: Validate guarded rollback request
        run: |
          test "$ROLLBACK_CONFIRM" = "ROLLBACK"
          if [[ ! "$ROLLBACK_VERSION_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]; then
            echo "Rollback requires an exact Cloudflare version UUID from a successful deployment record." >&2
            exit 1
          fi
          test -n "$ROLLBACK_REASON"

      - name: Checkout rollback tooling
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install deterministic deployment tooling
        run: npm ci

      - name: Roll back to exact Cloudflare version
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler rollback "$ROLLBACK_VERSION_ID" --name echobuddha --message "$ROLLBACK_REASON" --yes

      - name: Capture rollback deployment metadata
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          mkdir -p .artifacts/deployment
          npx wrangler deployments list --json > .artifacts/deployment/deployments.json
          node scripts/capture-cloudflare-deployment.mjs .artifacts/deployment/deployments.json .artifacts/deployment/rollback-record.json

      - name: Run production smoke gate after rollback
        run: npm run audit:production-smoke

      - name: Upload rollback evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-rollback-${{ github.run_id }}
          path: .artifacts/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 90
