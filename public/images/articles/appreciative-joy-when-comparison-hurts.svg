<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Room for both</title><desc id="desc">Their good news and my unmet hope can both be acknowledged. My worth is not decided by either.</desc>
<rect width="1200" height="675" fill="#f8f3e9"/>
<text x="70" y="82" font-family="Arial,sans-serif" font-size="22" letter-spacing="4" fill="#435c47">ECHO BUDDHA · APPRECIATIVE JOY</text>
<text x="70" y="158" font-family="Georgia,serif" font-size="62" fill="#242a24">Room for both</text>
<rect x="70" y="210" width="510" height="270" rx="26" fill="#e1e9dc" stroke="#50634e" stroke-width="2"/>
<circle cx="122" cy="268" r="16" fill="#45644b"/>
<text x="105" y="335" font-family="Georgia,serif" font-size="42" fill="#242a24">Their good news</text>
<text x="105" y="392" font-family="Arial,sans-serif" font-size="24" fill="#3f493f">Something good happened for them.</text><rect x="620" y="210" width="510" height="270" rx="26" fill="#eee2ce" stroke="#50634e" stroke-width="2"/>
<circle cx="672" cy="268" r="16" fill="#927139"/>
<text x="655" y="335" font-family="Georgia,serif" font-size="42" fill="#242a24">My unmet hope</text>
<text x="655" y="392" font-family="Arial,sans-serif" font-size="24" fill="#3f493f">Something I wanted is still missing.</text>
<text x="70" y="567" font-family="Arial,sans-serif" font-size="32" fill="#242a24">My worth is not decided by either.</text>
<text x="70" y="624" font-family="Arial,sans-serif" font-size="21" fill="#435c47">An original editorial reading aid · not a scriptural quotation</text></svg>