  <path d="M186 512c184-178 279-55 392-178 112-121 184-150 436-96" fill="none" stroke="#fffdf8" stroke-width="52" stroke-linecap="round"/>
  <g fill="#6f8f69" stroke="#3f5d43" stroke-width="8">
    <circle cx="247" cy="468" r="48"/>
    <circle cx="426" cy="405" r="48"/>
    <circle cx="590" cy="327" r="48"/>
    <circle cx="748" cy="246" r="48"/>
    <circle cx="963" cy="244" r="48"/>
